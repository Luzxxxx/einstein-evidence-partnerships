<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc">
<title id="title">EINSTEIN multi-agent architecture</title><desc id="desc">A parent scheduler retrieves source evidence. Proposer and Counter-evidence run concurrently in separate Contexts, then an independent Critic reviews their draft and counter-report. At most one revision returns to Critic. Only the parent publication gate can publish.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#28788c"/></marker></defs>
<rect width="1180" height="570" rx="24" fill="#edf5f8"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#183b51"><text x="40" y="52" font-size="24" font-weight="700">Three perspectives. One traceable decision.</text><text x="40" y="80" font-size="14" fill="#527184">Real Mozaik Agents · isolated Contexts · source-bound artifacts</text></g>
<g stroke="#28788c" fill="none" stroke-width="2.5" marker-end="url(#arrow)"><path d="M218 270H268V190H310"/><path d="M268 270V345H310"/><path d="M540 190H595V270H650"/><path d="M540 345H595V270"/><path d="M870 270H930"/><path d="M760 325V425H520V393"/><path d="M1040 325V458"/></g>
<g fill="white" stroke="#c8dce5"><rect x="40" y="210" width="178" height="120" rx="12"/><rect x="310" y="135" width="230" height="110" rx="12"/><rect x="310" y="290" width="230" height="110" rx="12"/><rect x="650" y="210" width="220" height="120" rx="12"/><rect x="930" y="210" width="210" height="120" rx="12"/><rect x="930" y="460" width="210" height="65" rx="12"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#183b51"><text x="60" y="243" font-size="18" font-weight="700">Parent scheduler</text><text x="60" y="272" font-size="14">Challenge + retrieval</text><text x="60" y="297" font-size="14">Queue / limits / store</text><text x="332" y="172" font-size="19" font-weight="700">Proposer</text><text x="332" y="200" font-size="14">Evidence → draft</text><text x="332" y="222" font-size="13" fill="#527184">Independent Context A</text><text x="332" y="327" font-size="19" font-weight="700">Counter-evidence</text><text x="332" y="355" font-size="14">Limits + contradictions</text><text x="332" y="377" font-size="13" fill="#527184">Independent Context B</text><text x="365" y="271" font-size="14" font-weight="700" fill="#1d798d">RUN CONCURRENTLY</text><text x="675" y="248" font-size="19" font-weight="700">Critic</text><text x="675" y="276" font-size="14">Approve / revise / abstain</text><text x="675" y="302" font-size="13" fill="#527184">Independent Context C</text><text x="950" y="246" font-size="18" font-weight="700">Parent gate</text><text x="950" y="275" font-size="14">Evidence + versions</text><text x="950" y="301" font-size="14">Approval + cleanup</text><text x="952" y="487" font-size="16" font-weight="700">Proposal + full trace</text><text x="952" y="509" font-size="13">or an honest saved outcome</text><text x="550" y="452" font-size="14" fill="#527184">At most one revision + recheck</text><text x="40" y="516" font-size="14" fill="#527184">Read-only source tools · exact citations · no model can publish directly</text></g></svg>
